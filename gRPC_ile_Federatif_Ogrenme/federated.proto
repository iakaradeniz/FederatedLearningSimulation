syntax = "proto3";
package federated;

message LayerWeights {
  string name           = 1;
  bytes values          = 2;
  repeated int32 shape  = 3; 
}

message WeightsRequest {
  string client_id    = 1;   
  int32  round = 2;   
  int32  num_samples  = 3;   
  repeated LayerWeights layers = 4; 
}

message GlobalModelResponse {
  int32  round = 1;
  string status = 2;
  repeated LayerWeights layers = 3;
}

message StatusRequest {
  string client_id = 1;
}

message StatusResponse {
  int32  current_round = 1;
  int32  clients_registered = 2;
  int32  clients_this_round = 3;
  string message = 4;
}

service FederatedLearning {
  rpc SendWeights (WeightsRequest) returns (GlobalModelResponse);
  rpc GetStatus (StatusRequest) returns (StatusResponse);
}
